<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="Planta industrial con chimeneas, tuberías y engranaje" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5a73"/>
      <stop offset="1" stop-color="#e8a45c"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" fill="url(#cielo)"/>
  <!-- humo -->
  <g fill="#d8dde2" opacity=".85">
    <circle cx="22" cy="14" r="5"/><circle cx="28" cy="9" r="6"/><circle cx="36" cy="6" r="5"/>
    <circle cx="52" cy="16" r="4"/><circle cx="58" cy="11" r="5"/>
  </g>
  <!-- chimeneas -->
  <g fill="#4a4f55">
    <rect x="18" y="20" width="9" height="34"/>
    <rect x="48" y="24" width="8" height="30"/>
  </g>
  <g fill="#c0392b">
    <rect x="18" y="26" width="9" height="3"/>
    <rect x="48" y="30" width="8" height="3"/>
  </g>
  <!-- nave industrial con techo en dientes de sierra -->
  <path d="M4 54 V40 L16 32 V40 L28 32 V40 L40 32 V40 L52 32 V40 L64 32 V54 Z" fill="#6b7178"/>
  <rect x="4" y="54" width="72" height="18" fill="#555b62"/>
  <rect x="64" y="38" width="12" height="34" fill="#6b7178"/>
  <!-- ventanas -->
  <g fill="#ffd36b">
    <rect x="9" y="58" width="8" height="5"/>
    <rect x="21" y="58" width="8" height="5"/>
    <rect x="33" y="58" width="8" height="5"/>
    <rect x="45" y="58" width="8" height="5"/>
  </g>
  <!-- puerta -->
  <rect x="58" y="60" width="8" height="12" fill="#2f3438"/>
  <!-- tuberías -->
  <g fill="none" stroke="#9aa3ab" stroke-width="3" stroke-linecap="round">
    <path d="M70 38 V24 H76"/>
    <path d="M4 66 H0"/>
  </g>
  <rect x="68.5" y="22" width="3" height="3" fill="#c0392b"/>
  <!-- engranaje -->
  <g transform="translate(60 12)">
    <g fill="#2f3438">
      <rect x="-1.5" y="-9" width="3" height="18"/>
      <rect x="-9" y="-1.5" width="18" height="3"/>
      <rect x="-1.5" y="-9" width="3" height="18" transform="rotate(45)"/>
      <rect x="-1.5" y="-9" width="3" height="18" transform="rotate(-45)"/>
      <circle r="6"/>
    </g>
    <circle r="2.5" fill="#e8a45c"/>
  </g>
  <!-- suelo -->
  <rect x="0" y="72" width="80" height="8" fill="#2f3438"/>
</svg>
